name: isolated-project-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install CI-only ash and lint tools
        run: sudo apt-get update && sudo apt-get install -y busybox shellcheck
      - name: Install router-matching BusyBox 1.33.1
        uses: ./.github/actions/pinned-busybox
      - name: Require every preflight suite in the preflight_suites matrix
        run: |
          sh tests/run.sh --list-preflight-suites | sort > "$RUNNER_TEMP/suites-run-sh.txt"
          sed -n "s/^ *- suites: '\(.*\)'$/\1/p" .github/workflows/ci.yml | tr ' ' '\n' | sort > "$RUNNER_TEMP/suites-matrix.txt"
          diff -u "$RUNNER_TEMP/suites-run-sh.txt" "$RUNNER_TEMP/suites-matrix.txt"
      - name: Static checks and acceptance preflight
        env:
          CF_TEST_SHELL: busybox ash
          CF_TEST_AWK: busybox awk
          CF_TEST_TIMEOUT: busybox timeout
        run: |
          busybox 2>&1 | awk 'NR == 1 { print }'
          python3 tools/freeze-router-release.py --check
          sh tests/run.sh --static-only
          sh tests/acceptance.sh --preflight
          python3 tests/run-fixtures.py --write-plan "$RUNNER_TEMP/couvre-feu-plan.json"
      - name: Publish complete source-bound partition plan
        uses: actions/upload-artifact@v4
        with:
          name: fixture-plan
          path: ${{ runner.temp }}/couvre-feu-plan.json
          if-no-files-found: error
  preflight_suites:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suites: 'test-install.py'
          - suites: 'test-install-recovery.py'
          - suites: 'test-platform-integration.py'
          - suites: 'test-os-trust.py'
          - suites: 'test-install-recovery-primitives.py test-install-retirement-recovery.py test-install-legacy-recovery.py test-no-dev-stdin.py test-client-probe.py test-live-rehearsal.py test-deploy-units.py test-service-key-entry.py'
    steps:
      - uses: actions/checkout@v4
      - name: Install CI-only ash and lint tools
        run: sudo apt-get update && sudo apt-get install -y busybox shellcheck
      - name: Install router-matching BusyBox 1.33.1
        uses: ./.github/actions/pinned-busybox
      - name: Run the named preflight suites
        env:
          CF_TEST_SHELL: busybox ash
          CF_TEST_AWK: busybox awk
          CF_TEST_TIMEOUT: busybox timeout
        run: |
          busybox 2>&1 | awk 'NR == 1 { print }'
          sh tests/run.sh --preflight-suite ${{ matrix.suites }}
  fixture_shards:
    needs: [fixture_preflight, preflight_suites]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [test-transition.py, test-rpc.py, test-core.py, test-fixture-process.py, test-penn-pilot.py, test-penn-pilot-leg2.py, test-penn-pilot-leg2-guards.py, test-scope-admin.py, test-inventory.py]
        partition: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install CI-only ash runtime
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Install router-matching BusyBox 1.33.1
        uses: ./.github/actions/pinned-busybox
      - uses: actions/download-artifact@v5
        with:
          name: fixture-plan
          path: .ci-fixture-plan
      - name: Run one existing bounded partition and record every case
        env:
          CF_TEST_SHELL: busybox ash
          CF_TEST_AWK: busybox awk
          CF_TEST_TIMEOUT: busybox timeout
          CF_TEST_WORKERS: '1'
        run: |
          mkdir -m 700 "$RUNNER_TEMP/fixture-receipts"
          python3 tests/run-fixtures.py --shard '${{ matrix.suite }}' --partition '${{ matrix.partition }}' --plan .ci-fixture-plan/couvre-feu-plan.json --receipt "$RUNNER_TEMP/fixture-receipts/${{ matrix.suite }}.${{ matrix.partition }}.json"
      - name: Publish unique shard coverage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-receipt-${{ matrix.suite }}-${{ matrix.partition }}
          path: ${{ runner.temp }}/fixture-receipts/${{ matrix.suite }}.${{ matrix.partition }}.json
          if-no-files-found: error
  fixtures:
    needs: [fixture_preflight, preflight_suites, fixture_shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require successful preflight and every matrix job
        env:
          PREFLIGHT_RESULT: ${{ needs.fixture_preflight.result }}
          SUITES_RESULT: ${{ needs.preflight_suites.result }}
          MATRIX_RESULT: ${{ needs.fixture_shards.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$SUITES_RESULT" = success && test "$MATRIX_RESULT" = success
      - name: Install CI-only ash for identical discovery
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Install router-matching BusyBox 1.33.1
        uses: ./.github/actions/pinned-busybox
      - uses: actions/download-artifact@v5
        with:
          name: fixture-plan
          path: .ci-fixture-plan
      - uses: actions/download-artifact@v5
        with:
          pattern: fixture-receipt-*
          merge-multiple: true
          path: .ci-fixture-receipts
      - name: Prove all 36 unique partitions match complete source discovery
        env:
          CF_TEST_SHELL: busybox ash
        run: python3 tests/run-fixtures.py --verify-receipts .ci-fixture-receipts --plan .ci-fixture-plan/couvre-feu-plan.json
  local-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm
      - name: Install locked project dependencies
        run: |
          node --version
          npm --version
          npm ci
      - name: Check types and durable fake-router service behavior
        run: npm run typecheck && npm run test:service
      - name: Install isolated browser-test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify authenticated browser and offline behavior
        run: npm run test:web
